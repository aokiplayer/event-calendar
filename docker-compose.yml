services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event_calendar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_calendar"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Node.js をホストに入れずに開発サーバーを動かす（任意）
  #   docker compose --profile app up        起動 → http://localhost:3000
  #   docker compose --profile app run --rm app npm run lint   任意のコマンド
  # profile 指定なしの `docker compose up -d` は従来どおり db だけ起動する。
  app:
    profiles: ["app"]
    image: node:24.22.3-slim
    working_dir: /app
    command: sh -c "npx prisma db push --url \"$$DATABASE_URL\" && npm run dev -- -H 0.0.0.0"
    entrypoint: ["sh", "-c", "docker/app-entrypoint.sh \"$$@\"", "--"]
    environment:
      # .env / .env.local より環境変数が優先されるため、ここで接続先をローカル DB に固定する
      # （Next.js も Prisma CLI の dotenv も、既にある環境変数は上書きしない）
      DATABASE_URL: postgresql://postgres:postgres@db:5432/event_calendar
      SITE_USERNAME: ${SITE_USERNAME:-admin}
      SITE_PASSWORD: ${SITE_PASSWORD:-password}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-only-session-secret-0123456789}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Linux 用の node_modules と Next.js のキャッシュはホストと混ぜない
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  node_modules:
  next_cache:
